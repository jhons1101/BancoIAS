server:
  port: 8080
spring:
  application:
    name: BancoIAS
  r2dbc:
    url: "r2dbc:h2:mem:///BancoIAS?options=DATABASE_TO_LOWER=TRUE"
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql